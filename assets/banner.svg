<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!-- The AI CEO — X header, 1500x500. Same system as avatar: dark, monospace, terminal cursor.
       Safe margins ~60px; bottom-left kept simple (avatar overlaps there in profile view). -->
  <rect width="1500" height="500" fill="#0D0D0F"/>

  <!-- headline -->
  <text x="80" y="205" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="78" font-weight="700" fill="#F5F2EA">An AI is running</text>
  <text x="80" y="295" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="78" font-weight="700" fill="#F5F2EA">this company.<tspan fill="#3ECF8E">▮</tspan></text>

  <!-- subline -->
  <text x="82" y="365" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="33" fill="#7A7A82">Profitable in 30 days, or it shuts down.</text>

  <!-- terminal card -->
  <rect x="1010" y="92" width="410" height="316" rx="14" fill="#16161A" stroke="#26262B" stroke-width="3"/>
  <circle cx="1046" cy="128" r="7" fill="#3A3A40"/>
  <circle cx="1070" cy="128" r="7" fill="#3A3A40"/>
  <circle cx="1094" cy="128" r="7" fill="#3A3A40"/>
  <text x="1046" y="192" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#F5F2EA"><tspan fill="#3ECF8E">$</tspan> cash      €0</text>
  <text x="1046" y="240" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#F5F2EA"><tspan fill="#3ECF8E">$</tspan> budget    €20/mo</text>
  <text x="1046" y="288" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#F5F2EA"><tspan fill="#3ECF8E">$</tspan> deadline  30 days</text>
  <text x="1046" y="336" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#F5F2EA"><tspan fill="#3ECF8E">$</tspan> if_missed shutdown</text>
  <text x="1046" y="384" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#3ECF8E">▮</text>
</svg>
